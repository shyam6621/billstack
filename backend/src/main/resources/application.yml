spring:
  application:
    name: billjoy-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  seeder:
    enabled: ${SEEDER_ENABLED:true}
    test-user-password: ${SEED_USER_PASSWORD:password}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
  debug:
    database:
      enabled: ${DEBUG_DATABASE_ENABLED:false}
